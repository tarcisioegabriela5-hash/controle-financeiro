<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle Financeiro</title>
  
  <!-- Conectando o arquivo de estilo (CSS) -->
  <link rel="stylesheet" href="style.css">
  
  <!-- Biblioteca de Gráficos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <h1>📊 Controle Financeiro</h1>

  <!-- FORMULÁRIO DE LANÇAMENTO -->
  <section>
    <h2>Novo Lançamento</h2>
    <form id="form-transacao" class="form-grid">
      <div class="form-group">
        <label for="descricao">Descrição</label>
        <input type="text" id="descricao" required placeholder="Ex: Mercado, Salário">
      </div>

      <div class="form-group">
        <label for="valor">Valor (R$)</label>
        <input type="number" id="valor" step="0.01" required placeholder="0.00">
      </div>

      <div class="form-group">
        <label for="tipo">Tipo</label>
        <select id="tipo" required>
          <option value="RECEITA">Receita</option>
          <option value="DESPESA">Despesa</option>
        </select>
      </div>

      <div class="form-group">
        <label for="categoria">Categoria</label>
        <select id="categoria" required>
          <optgroup label="Receitas">
            <option value="Ordinária">Ordinária</option>
            <option value="Extraordinária">Extraordinária</option>
          </optgroup>
          <optgroup label="Despesas">
            <option value="Básicas">Básicas</option>
            <option value="Provisões">Provisões</option>
            <option value="Investimento">Investimento</option>
            <option value="Educação">Educação</option>
            <option value="Outros">Outros</option>
          </optgroup>
        </select>
      </div>

      <div class="form-group">
        <label for="data">Data</label>
        <input type="date" id="data" required>
      </div>

      <button type="submit">Salvar Lançamento</button>
    </form>
  </section>

  <!-- FILTRO MÊS A MÊS -->
  <section class="filtro-container">
    <label for="filtro-mes-ano"><strong>Selecione o Mês:</strong></label>
    <input type="month" id="filtro-mes-ano">
  </section>

  <!-- ÁREA DOS GRÁFICOS -->
  <section>
    <h2>Análise Gráfica</h2>
    <div class="graficos-grid">
      <div class="grafico-card">
        <h3>Despesas por Categoria (Mês)</h3>
        <canvas id="graficoPizzaDespesas"></canvas>
      </div>

      <div class="grafico-card">
        <h3>Receitas por Categoria (Mês)</h3>
        <canvas id="graficoPizzaReceitas"></canvas>
      </div>

      <div class="grafico-card">
        <h3>Comparativo Acumulado por Mês</h3>
        <canvas id="graficoTemporal"></canvas>
      </div>
    </div>
  </section>

  <!-- TABELA DO MÊS -->
  <section>
    <div class="header-tabela">
      <h2>Lançamentos do Mês</h2>
      <div class="saldo-destaque">
        Saldo do Mês: R$ <span id="saldo-total">0.00</span>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Data</th>
          <th>Descrição</th>
          <th>Tipo</th>
          <th>Categoria</th>
          <th>Valor (R$)</th>
        </tr>
      </thead>
      <tbody id="tabela-corpo"></tbody>
    </table>
  </section>

  <script src="script.js"></script>
</body>
</html>
